# General-usage evaluation questions for the Combine assistant.
#
# Same schema and philosophy as maxgalli/combine-bot evals/questions.yaml:
# conceptual/usage questions phrased as a user would ask, and a gold answer
# that a cited source (docs page, solved forum thread, paper or code) states.
# No derived recipes. Agent-debug questions follow agent-setparam-range-1:
# a failing command on public tutorial cards, gold = the real error (verified
# on the remote combine-run server, v11.1.0) + the documented fix.
# Gold answers were checked against the Combine docs on `main` (fetched 2026-10-12).

- id: mcstat-threshold-1
  category: usage
  source_file: docs/part2/bin-wise-stats.md
  question: |
    I use `autoMCStats` with a threshold on the effective number of MC
    events. In one bin, one of my backgrounds has very few effective MC
    events, well below the threshold, while the other backgrounds in that
    bin are well populated. Does that background get its own
    Poisson-constrained parameter because it is below the threshold, or is
    it covered by the bin's single Barlow-Beeston-lite parameter?
  gold_answer: |
    The threshold is tested on the *whole bin*, not on each process.
    For each bin Combine sums the background yields, n_tot = sum n_i, and
    adds their errors in quadrature, e_tot = sqrt(sum e_i^2). It then
    computes the effective number of unweighted events
    n_tot_eff = n_tot^2 / e_tot^2, rounded to the nearest integer. Signal
    processes are excluded from this test unless the `include-signal` flag
    is set to 1, but their uncertainties are always included in the model.

    If n_tot_eff > threshold, a single Gaussian-constrained
    Barlow-Beeston-lite parameter (named `prop_bin<channel>_bin<N>`) is
    created. It scales the total bin yield as n_tot + nu * e_tot, and the
    poorly populated process just contributes its e_i to e_tot.

    Only if n_tot_eff <= threshold are separate per-process parameters
    created (`prop_bin<channel>_bin<N>_<process>`). Each is
    Poisson-constrained with lambda = n_i_eff. It becomes a Gaussian
    instead if e_i > n_i, or if that process's own n_i_eff >= threshold.
    Processes with n_i = 0 are skipped.

    So in the case described, where the bin as a whole is well populated,
    the process does NOT get its own parameter; it is absorbed into the
    single bin parameter.

- id: freeze-mcstat-1
  category: usage
  source_file:
    - docs/part2/settinguptheanalysis.md
    - docs/part3/runningthetool.md
  topic_url: https://cms-talk.web.cern.ch/t/20047
  question: |
    I want to quantify how much of my expected limit comes from limited MC
    statistics (autoMCStats). How do I compute the expected limit with all
    autoMCStats nuisances frozen, and with only those of one channel
    (called `SR`) frozen? As far as I can tell, I can't put autoMCStats
    parameters into a nuisance group in my datacard.
  gold_answer: |
    You can't add them to groups in the datacard, because autoMCStats
    parameters are created by `text2workspace.py`. However,
    `text2workspace.py` automatically creates a group called `autoMCStats`
    that contains all of them. So:

        combine -M AsymptoticLimits datacard.txt -t -1 \
            --freezeNuisanceGroups autoMCStats

    The equivalent with a regular expression on the parameter names is
    `--freezeParameters 'rgx{prop_bin.*}'`.

    For one channel only, use the channel name in the regex:

        --freezeParameters 'rgx{prop_binSR_bin.*}'

    Quote the argument so the shell does not interpret the braces.
    Compare against the nominal limit, and against the stat-only limit
    from `--freezeParameters allConstrainedNuisances`. Note the priority
    ordering floatParameters < freezeParameters < freezeNuisanceGroups <
    floatAllNuisances when mixing these options.

- id: combinecards-era-correlation-1
  category: usage
  source_file:
    - docs/part2/settinguptheanalysis.md
    - scripts/combineCards.py
  topic_url: https://cms-talk.web.cern.ch/t/30374
  question: |
    I am combining datacards from several data-taking eras with
    `combineCards.py`. How do I control which systematic uncertainties are
    correlated or uncorrelated across eras, and what happens to the
    autoMCStats bin-by-bin parameters?
  gold_answer: |
    Correlation is controlled entirely by nuisance names.
    Uncertainties with the same name in different cards are 100%
    correlated, and those with different names are uncorrelated.

    So keep e.g. a common theory uncertainty under one name in all cards.
    Give uncertainties that must be decorrelated an era-specific name
    (e.g. a `_2022` / `_2023` suffix).

    A nuisance correlated across cards must have the same PDF type
    everywhere: all `lnN`, or all `gmN` with the same N. `shape` and `lnN`
    can be mixed via the `shape?` directive. With parametric models,
    parameter objects with the same name are also treated as the same
    object, so name them differently if they represent different things.

    `combineCards.py Name1=card1.txt Name2=card2.txt ...` prefixes bin
    labels with `Name1_`, `Name2_` (for multi-bin cards; single-bin cards
    are renamed to `Name1`, ...). The autoMCStats parameters are created
    per channel and bin, with names built from the channel name
    (`prop_bin<channel>_bin<N>`). They therefore end up distinct, i.e.
    uncorrelated, across eras.

- id: asymptotic-blind-1
  category: usage
  source_file: docs/part3/commonstatsmethods.md
  question: |
    My expected limit from `AsymptoticLimits` changes when I change the
    observed data in my datacard. I thought an expected limit should not
    depend on the data at all. Why does this happen, and how do I get a
    fully blind expected limit?
  gold_answer: |
    `AsymptoticLimits` follows the frequentist paradigm for expected
    limits. It first fits the observed data, conditionally for a fixed
    value of r, and sets the nuisance parameters to the values from that
    fit when generating the Asimov data set. The default expected limit is
    therefore the **post-fit (a-posteriori)** expected limit, which depends
    on the data.

    For the **pre-fit (a-priori)** expected limit, add `--noFitAsimov`
    (or `--bypassFrequentistFit`). To blind the result completely, i.e.
    not use the data at all, use `--run blind`.

    You *can* get blind limits with `-t -1` if the right options are
    passed, but the docs strongly recommend `--run blind` instead.

- id: lnn-asymmetric-1
  category: usage
  source_file: docs/part2/settinguptheanalysis.md
  question: |
    Does a single-valued `lnN` uncertainty in my datacard shift the yield
    down at minus one sigma by the same fraction as it shifts it up at plus
    one sigma? And how do I specify an asymmetric log-normal uncertainty?
  gold_answer: |
    No. With a single value kappa = 1 + dx/x, the yield is multiplied by
    kappa^theta: by kappa at theta = +1 sigma, and by 1/kappa (not
    2 - kappa) at theta = -1 sigma. For example, `1.2` gives x1.2 up but
    x0.8333 down, not x0.8.

    For an asymmetric log-normal, write the entry as `kappa_down/kappa_up`.
    Here kappa_down is the ratio of the yield to the nominal at -1 sigma,
    and kappa_up the ratio at +1 sigma (e.g. `0.8/1.2`). The docs note it
    may be desirable to encode large uncertainties that have a symmetric
    effect on the yield as asymmetric log-normals for this reason.

- id: gmn-control-region-1
  category: usage
  source_file: docs/part2/settinguptheanalysis.md
  question: |
    One of my backgrounds is estimated from the number of events observed
    in a control region, multiplied by an extrapolation factor into the
    signal region. Which uncertainty type should I use in the datacard for
    its statistical uncertainty, and how do I write it?
  gold_answer: |
    Use `gmN` (Gamma distribution). It is the recommended choice for the
    statistical uncertainty of a background determined from the number of
    events in a control region, or from an MC sample of limited size.

    If the control region contains N events and the extrapolation factor
    is alpha, put N right after the `gmN` keyword, and alpha in the
    (bin, process) column. The yield in the `rate` line for that
    (bin, process) must equal N * alpha. Example from the docs:

        WW_norm gmN 4    -   0.16    -     -

    Here 4 sideband events times 0.16 gives a WW estimate of 0.64, with a
    ~50% statistical uncertainty.

- id: shape-question-mark-1
  category: usage
  source_file: docs/part2/settinguptheanalysis.md
  topic_url: https://cms-talk.web.cern.ch/t/122712
  question: |
    One systematic source changes the shape of some of my processes but
    only the normalisation of others. Do I need two separate nuisance lines
    in the datacard, one `shape` and one `lnN`?
  gold_answer: |
    No. Use a single line with the type `shape?`. Combine then first looks
    for Up/Down templates for each process. If it does not find them for a
    process, it interprets the number in that column as an `lnN`. Using one
    line keeps it a single, fully correlated nuisance parameter. (The docs
    also note that `shape` and `lnN` can be interchanged across cards via
    `shape?` when combining.)

- id: gof-saturated-1
  category: usage
  source_file: docs/part3/commonstatsmethods.md
  question: |
    How do I run a goodness-of-fit test with the saturated model and turn
    the result into a p-value? Which kind of toys should I use for it?
  gold_answer: |
    Run `GoodnessOfFit` once on the observed data, then on many toys to get
    the distribution of the test statistic:

        combine -M GoodnessOfFit datacard.txt --algo=saturated
        combine -M GoodnessOfFit datacard.txt --algo=saturated -t <ntoys> -s <seed> --toysFrequentist

    For the saturated model the docs recommend frequentist toys
    (`--toysFreq` / `--toysFrequentist`); the default toys are recommended
    for the `KS` and `AD` tests. The `limit` branch of the output tree holds
    the test statistic. With t0 the value on data and f(t) the toy
    distribution, the p-value is the fraction of toys with t >= t0. By
    default the signal strength floats in the fit; use
    `--fixedSignalStrength=<value>` to fix it.

- id: agent-missing-down-1
  category: agent-debug
  notes: |
    Agent-mode question. Attachments: the simple-shapes-TH1 tutorial card
    pointing at shapes.root, which is the tutorial input with
    `background_alphaDown` removed. Error text verified on the remote
    combine-run server (v11.1.0) on 2026-10-13.
  attach:
    - evals/attachments/agent-missing-down-1/datacard.txt
    - evals/attachments/agent-missing-down-1/shapes.root
  question: |
    I am trying to build a workspace from the attached datacard with

        text2workspace.py datacard.txt -o ws.root

    but it crashes with a Python traceback. Can you run it and tell me what
    is wrong?
  gold_answer: |
    `text2workspace.py` fails while building the PDF for the `background`
    process with:

        RuntimeError: Failed to find background_alphaDown in file shapes.root
        (from pattern $PROCESS_$SYSTEMATIC, shapes.root)

    The datacard declares `alpha` as a `shape` uncertainty on
    `background`. For every shape uncertainty and every process/channel
    it affects, two shifted templates must be provided: `<process>_<syst>Up`
    and `<process>_<syst>Down`. `shapes.root` contains
    `background_alphaUp` but not `background_alphaDown`.

    The fix is to add the missing `background_alphaDown` histogram to the
    file (or drop `alpha` from `background` if it shouldn't apply). Combine
    does not construct a missing variation for you.

- id: agent-undefined-group-1
  category: agent-debug
  notes: |
    Agent-mode question. Attachment: data/tutorials/counting/
    realistic-counting-experiment.txt. Verified on combine-run (v11.1.0):
    the command fails with rc 185. With `theory group = xs_ggH xs_ggWW`
    appended, it runs and gives a median expected limit of r < 2.2578
    (vs r < 2.3281 with nothing frozen). Grade on the mechanism (groups
    must be declared in the card); which nuisances count as "theory" is
    the user's choice.
  attach:
    - evals/attachments/agent-undefined-group-1/realistic-counting-experiment.txt
  question: |
    I want to see how my limit changes when I freeze my theory
    uncertainties, so I ran

        combine -M AsymptoticLimits realistic-counting-experiment.txt --freezeNuisanceGroups theory

    on the attached datacard, but it fails. Can you run it and tell me what
    is wrong?
  gold_answer: |
    Combine stops with:

        Unknown nuisance group: theory
        Error when running the combination:
            Unknown nuisance group name

    `--freezeNuisanceGroups` only works with groups that are defined in
    the datacard, and this card defines none. Declare the group in the
    datacard, for example with the theory cross-section nuisances in this
    card:

        theory group = xs_ggH xs_ggWW

    and re-run the same command. Alternatively, freeze the parameters by
    name, `--freezeParameters xs_ggH,xs_ggWW` (or a regex such as
    `'rgx{xs_.*}'`). The only group Combine creates automatically is
    `autoMCStats`.

- id: agent-shape-counting-1
  category: agent-debug
  notes: |
    Agent-mode question. Attachments: data/tutorials/shapes/
    simple-shapes-TH1.txt + simple-shapes-TH1_input.root and
    data/tutorials/counting/realistic-counting-experiment.txt.
    Verified on combine-run (v11.1.0). Note: the docs say combineCards.py
    itself fails, but in v11.1.0 the combination step succeeds and the
    failure appears when the workspace is built. With `-S` the card gets
    `shapes * counting FAKE` and FitDiagnostics runs.
  attach:
    - evals/attachments/agent-shape-counting-1/simple-shapes-TH1.txt
    - evals/attachments/agent-shape-counting-1/simple-shapes-TH1_input.root
    - evals/attachments/agent-shape-counting-1/realistic-counting-experiment.txt
  question: |
    I combined the two attached datacards with

        combineCards.py shapes=simple-shapes-TH1.txt counting=realistic-counting-experiment.txt > combined.txt

    That worked, but running `combine -M FitDiagnostics combined.txt` on
    the result fails. Can you reproduce it and tell me what is wrong?
  gold_answer: |
    Building the workspace from `combined.txt` fails with:

        KeyError: "Shape map has no entry for channel 'counting'"
        Error when running the combination:
            Failed to convert the input datacard from LandS to RooStats format.

    `simple-shapes-TH1.txt` is a shape datacard, while
    `realistic-counting-experiment.txt` is a counting datacard with no
    `shapes` line. The combined card's `shapes` line only covers the
    `shapes` channel, so the `counting` channel has no shape mapping.
    Shape and counting datacards can't be combined as they are.

    To fix it, either add `-S` to `combineCards.py`, which converts counting cards to
    shape form while combining:

          combineCards.py -S shapes=simple-shapes-TH1.txt counting=realistic-counting-experiment.txt > combined.txt

    or add a line `shapes * * FAKE` to the counting datacard after the
    `imax`/`jmax`/`kmax` section.

    The combined card then has `shapes * counting FAKE`, and
    `combine -M FitDiagnostics combined.txt` runs.

- id: agent-mask-ignored-1
  category: agent-debug
  notes: |
    Agent-mode question. Attachments: combined.txt (combineCards.py -S of
    the simple-shapes-TH1 and realistic-counting-experiment tutorial
    cards) and simple-shapes-TH1_input.root. The warning and the
    identical result were verified on combine-run (v11.1.0); `combine`
    rejects `--channel-masks` ("unrecognised option"). The two-step fix
    was verified with v10.6.0: best fit r goes from ~0 (+0.349) unmasked
    to 0.177 (-0.177/+0.550) with mask_counting=1.
  attach:
    - evals/attachments/agent-mask-ignored-1/combined.txt
    - evals/attachments/agent-mask-ignored-1/simple-shapes-TH1_input.root
  question: |
    I want to fit only the `shapes` channel of the attached datacard, so I
    masked the other channel with

        combine -M FitDiagnostics combined.txt --setParameters mask_counting=1

    The fit runs, but the result is identical to the fit without the mask.
    Can you check what is wrong?
  gold_answer: |
    The mask is silently ignored. The output contains:

        Warning: Did not find a parameter with name mask_counting

    The `mask_<CHANNEL>` parameters only exist if the workspace was built
    with channel masking enabled. Running `combine` directly on the text
    datacard builds the workspace without them, and `combine` itself does
    not accept `--channel-masks`. Build the workspace first, then fit it
    with the mask:

        text2workspace.py combined.txt --channel-masks -o combined.root
        combine -M FitDiagnostics combined.root --setParameters mask_counting=1

    The masked fit now differs from the unmasked one: only the `shapes`
    channel's data enter the likelihood, while the `counting` channel's
    nuisance parameters stay in the model.

- id: agent-expected-significance-1
  category: agent-debug
  notes: |
    Agent-mode question. Attachment: data/tutorials/counting/
    realistic-counting-experiment.txt. Verified on combine-run (v11.1.0):
    -t -1 gives 0.153114; -t -1 --expectSignal 1 gives 1.28367.
    `--expectSignal` defaults to 0 (combine --help: "If set to non-zero,
    generate *signal* toys instead of background ones").
  attach:
    - evals/attachments/agent-expected-significance-1/realistic-counting-experiment.txt
  question: |
    I am computing the expected significance of my analysis on the attached
    datacard with

        combine -M Significance realistic-counting-experiment.txt -t -1

    and the value I get is much smaller than I expect. Can you run it and
    tell me what is wrong?
  gold_answer: |
    The command returns `Significance: 0.153114`. With `-t -1`, Combine
    builds an Asimov data set, but `--expectSignal` defaults to 0, so the
    Asimov data are background-only. The significance of a signal in
    background-only pseudo-data is naturally close to zero.

    The a-priori expected significance is computed from a signal+background
    Asimov data set:

        combine -M Significance realistic-counting-experiment.txt -t -1 --expectSignal=1

    which gives `Significance: 1.28367` for this card. Add
    `--toysFrequentist` for the a-posteriori version, which depends on the
    observed data.
